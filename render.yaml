services:
  - type: web
    name: smartkoop-frontend
    runtime: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/build
    envVars:
      - key: REACT_APP_API_URL
        value: "https://your-backend-api.onrender.com/api/v1"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
